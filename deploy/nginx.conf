# Internal HTTP listener: expose ONLY through Cloudflare Tunnel, or add local TLS.
# Do not publish this listener directly on the Internet.
worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=2r/s;
    limit_req_zone $server_name zone=aggregate:1m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    client_max_body_size 7m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_req_status 429;
    server {
        listen 127.0.0.1:8080;
        limit_conn connections 20;
        limit_req zone=per_ip burst=20 nodelay;
        limit_req zone=aggregate burst=50 nodelay;
        location ~ ^/api/(login|auth/) {
            limit_req zone=auth_ip burst=5 nodelay;
            client_max_body_size 64k;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header CF-Connecting-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header CF-Connecting-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
