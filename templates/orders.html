<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Pedidos e suporte · NziStore</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/orders.css?v=202"><link rel="icon" type="image/png" href="/static/nzi-logo.png?v=2"><link rel="stylesheet" href="/static/halloween.css?v=2"><link rel="stylesheet" href="/static/experience.css?v=4"></head>
<body class="admin"><header class="admin-top"><div class="admin-top-in"><a class="brand" href="/"><span class="nzi-logo-frame"><img src="/static/nzi-logo.png?v=2" alt="Nzi Store"></span></a><a class="btn ghost sm" href="/conta">Minha conta</a><a id="admin-link" class="btn ghost sm" href="/dashboard" hidden>Painel</a></div></header>
<main class="orders-shell"><div class="dash-head"><div><p class="eyebrow">Compra e atendimento</p><h1 id="page-title">Meus pedidos</h1></div><button class="btn ghost" id="refresh-orders" type="button">Atualizar pedidos</button></div>
<p id="orders-status" class="msg" role="status"></p><p id="login-needed" hidden>Entre na sua conta para ver pedidos e conversar com o suporte. <a class="btn" href="/conta">Entrar</a></p>
<div class="orders-layout"><section class="panel"><h2>Pedidos</h2><div id="orders-list"></div><div class="form-actions"><button id="previous-page" class="btn ghost sm" type="button" disabled>Anterior</button><button id="next-page" class="btn ghost sm" type="button" disabled>Próxima</button></div></section>
<section class="panel" id="order-detail" hidden><h2 id="order-title"></h2><div id="order-info"></div><div id="order-items"></div>
<section id="payment-area"><h3>Pagamento Pix</h3><p id="payment-status" role="status"></p><a id="open-payment-page" class="btn" href="/">Abrir pagamento com QR Code</a><p id="payment-expiry-note" class="muted"></p></section>
<section class="order-chat"><h3>Chat com o suporte</h3><p class="muted">Conversa privada deste pedido. Novas mensagens aparecem automaticamente.</p><p id="chat-presence" class="chat-presence" role="status"></p><div id="chat-messages" role="log" aria-live="polite" aria-label="Mensagens do pedido" tabindex="0"></div><form id="chat-form"><label for="chat-text">Mensagem</label><textarea id="chat-text" maxlength="2000" rows="3" required placeholder="Como podemos ajudar?"></textarea><button class="btn" type="submit" id="send-chat">Enviar mensagem</button></form><p id="chat-status" class="msg" role="status"></p></section>
</section></div></main><script src="/static/orders.js?v=205"></script><script src="/static/experience.js?v=4"></script></body></html>
